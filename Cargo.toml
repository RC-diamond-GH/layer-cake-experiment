[package]
name = "layer-cake"
version = "0.1.0"
edition = "2024"
description = "Observable, controllable agent mechanism experiments"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lib]
name = "layer_cake"

[[bin]]
name = "layer-cake"
path = "src/main.rs"
